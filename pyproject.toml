[project]
name = "vgi-polymarket"
dynamic = ["version"]
description = "A read-only VGI (Vector Gateway Interface) worker exposing Polymarket prediction-market data to DuckDB/SQL"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Query Farm LLC", email = "hello@query.farm" }]
maintainers = [{ name = "Query Farm LLC", email = "hello@query.farm" }]
keywords = ["vgi", "duckdb", "arrow", "polymarket", "prediction-markets", "sql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Office/Business :: Financial",
]

requires-python = ">=3.13"
dependencies = [
    "vgi-python[http]>=0.31.0",
    "httpx>=0.27",
]

# Sub-tables must follow every key of `[project]`: a `[project.urls]` header
# placed above `dependencies` ends the `[project]` table, and the keys after it
# silently become URLs instead. That is not a build error — it is a package with
# no dependencies, which installs and then fails at import.
[project.urls]
Homepage = "https://query.farm"
Documentation = "https://query.farm/vgi/"
Repository = "https://github.com/Query-farm/vgi-polymarket"
Issues = "https://github.com/Query-farm/vgi-polymarket/issues"
"VGI Protocol" = "https://query.farm/vgi/"

# No `brotli` here, unlike the sibling Kalshi worker. Polymarket's CDN answers
# `Accept-Encoding: br, gzip, zstd` with gzip on every host, so the codec would
# be installed and never negotiated. See tests/test_packaging.py::TestTransport,
# which pins the encodings actually offered.
#
# No `cryptography` either: there is no read credential to sign with. See the
# authentication section of the README.

[project.optional-dependencies]
serve = ["vgi-python[http,oauth]>=0.31.0", "vgi-rpc[sentry]>=0.44.1"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15",
]

[project.scripts]
vgi-polymarket = "vgi_polymarket.worker:main"
vgi-polymarket-http = "vgi_polymarket.worker:main_http"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "vgi_polymarket/__init__.py"

[tool.uv.sources]
vgi-python = { path = "../vgi-python" }
vgi-rpc = { path = "../vgi-rpc" }

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests hit the public Polymarket API; opt in with `pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: hits the real Polymarket API over the network"]
