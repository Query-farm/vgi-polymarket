# vgi-lint configuration for the Polymarket worker.
#
#   vgi-lint lint --audit-waivers
#
# re-runs the rules these waivers silence and fails if either has stopped buying
# anything — a waiver that suppresses nothing is a standing claim nobody
# revisits, and it hides the moment the rule starts applying.

# The installed console script (`uv sync --no-dev`), as CI lints it. The
# `polymarket_worker.py` entry needs sibling vgi-python/vgi-rpc checkouts.
location = ".venv/bin/vgi-polymarket"
select = ["ALL"]
# Publication bar: zero findings, info included.
fail_on = "info"

ignore = [
  { code = "VGI311", kind = "tooling-bug", reason = """\
Both parameterless scans here ARE exposed as tables: all_tags backs `tags` and \
all_series backs `series`. The rule looks for a table whose name matches the \
function's, so it cannot see the link. The names differ deliberately — a \
function and a table cannot share one name in a schema, so the scan takes the \
`all_` prefix and the table keeps the name consumers actually type.\
""" },
]

[per-object]
# `tag_id` is this table's own primary key, not a reference to another table.
# The rule matches on the `<table>_id` name shape, which here collides with the
# singular of the table's own name; a foreign key from tags.tag_id to tags.tag_id
# would assert a self-reference that means nothing.
"polymarket.main.tags" = { ignore = [
  { code = "VGI808", kind = "domain-exemption", reason = "tag_id is this table's own primary key, not a reference to another table" },
] }

# A market row is 33 columns wide, several of them structs and lists with their
# own documented fields, and vgi.result_columns_schema is its static result
# shape. Truncating it would hide columns from an agent; DESCRIBE and
# duckdb_columns() carry the same shape at full length.
"polymarket.main.markets" = { ignore = [
  { code = "VGI417", kind = "domain-exemption", reason = "33-column market row; the result shape cannot be shortened without dropping columns" },
] }
"polymarket.main.market" = { ignore = [
  { code = "VGI417", kind = "domain-exemption", reason = "33-column market row; the result shape cannot be shortened without dropping columns" },
] }
"polymarket.main.event_markets" = { ignore = [
  { code = "VGI417", kind = "domain-exemption", reason = "33-column market row; the result shape cannot be shortened without dropping columns" },
] }

# Every executable example calls Polymarket's live APIs, and the linter runs them
# concurrently. Run alone, the slowest ones finish in 1-2.5 s; run together they
# land at 5-8 s, and which ones cross the default 5 s bar changes from run to run
# (the tags/series agreement checks each walk the whole catalog twice by design).
# This raises the warning bar only; no example's result or timeout is affected.
[execution]
slow_seconds = 10
