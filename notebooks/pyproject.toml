[project]
name = "vgi-polymarket-notebooks"
version = "0.1.0"
description = "Displayed order-book depth and bounded fill accounting"
requires-python = ">=3.13,<3.15"
dependencies = [
    "haybarn==2.0.0rc11",
    "ipykernel>=6.30,<8",
    "jupysql>=0.11,<0.12",
    "matplotlib>=3.10,<4",
    "nbclient>=0.10,<0.11",
    "nbformat>=5.10,<6",
    "pandas>=2.2,<3",
    "requests==2.34.2",
    "seaborn>=0.13.2,<0.14",
    "toml>=0.10,<0.11",
]

[tool.ruff]
builtins = ["market_table", "availability", "fills"] # JupySQL result captures
line-length = 110
target-version = "py313"
extend-exclude = ["artifacts", "validation"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"] # Visible SQL and result-derived prose retain readable lines
