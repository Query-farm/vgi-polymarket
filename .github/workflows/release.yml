name: Release candidate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Builds and verifies a tagged version. It deliberately publishes nowhere:
# nothing here talks to PyPI or cuts a GitHub Release, so a tag is a checkpoint
# rather than an irreversible act. Adding a publish step later is one job.
jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # `--no-sources` ignores [tool.uv.sources], which points vgi-python and
      # vgi-rpc at sibling checkouts that exist only on a development machine.
      # A release must resolve the published versions instead, and this is the
      # step that proves it can — the failure mode CI cannot see, because CI
      # uses the same flag but never builds a distribution from the result.
      - name: Verify against published dependencies
        run: |
          uv sync --no-sources --group dev
          uv run --no-sources ruff format --check .
          uv run --no-sources ruff check .
          uv run --no-sources pytest -q

      - name: Build
        run: uv build

      # A tag that disagrees with the packaged version produces an artifact
      # nobody can reason about afterwards.
      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(uv run --no-sources python -c 'import vgi_polymarket; print(vgi_polymarket.__version__)')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag $tag does not match __version__ $version" >&2
            exit 1
          fi
          echo "version $version matches tag $tag"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
