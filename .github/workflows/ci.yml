name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The two entry-point scripts resolve vgi-python and vgi-rpc from sibling
      # checkouts via [tool.uv.sources]; CI has no siblings, so it installs the
      # published versions from [project.dependencies] instead.
      - name: Install
        run: uv sync --no-sources --group dev

      - name: Format
        run: uv run --no-sources ruff format --check .

      - name: Lint
        run: uv run --no-sources ruff check .

      # The deterministic offline suite. The separate live job below owns
      # checks against Polymarket's current public API behaviour.
      - name: Tests
        run: uv run --no-sources pytest -q

  live:
    name: live API tests
    runs-on: ubuntu-latest
    # Not on pull requests: a fork's PR should not be able to fail on, or spend,
    # someone else's rate limit. Also scheduled so the assertions about Polymarket's
    # own behaviour — page caps, silently ignored filters, the activity types it
    # emits — keep being checked against the real thing rather than a memory.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync --no-sources --group dev
      - name: Live tests
        run: uv run --no-sources pytest -q -m live --ignore=tests/test_end_to_end.py
