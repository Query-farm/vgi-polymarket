name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The two entry-point scripts resolve vgi-python and vgi-rpc from sibling
      # checkouts via [tool.uv.sources]; CI has no siblings, so it installs the
      # published versions from [project.dependencies] instead.
      - name: Install
        run: uv sync --no-sources --group dev

      - name: Format
        run: uv run --no-sources ruff format --check .

      - name: Lint
        run: uv run --no-sources ruff check .

      # The deterministic offline suite. The separate live job below owns
      # checks against Polymarket's current public API behaviour.
      - name: Tests
        run: uv run --no-sources pytest -q

  integration:
    name: SQL tests (${{ matrix.os }}, ${{ matrix.transport }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        transport: [stdio, launch, http]
    defaults:
      run:
        shell: bash
    env:
      HAYBARN_VERSION: "2.0.1rc3"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Build the worker
        run: uv sync --locked --no-sources --all-extras
      - name: Install the SQL test runner
        run: |
          uv venv .tools
          uv pip install -p .tools "haybarn-unittest==${HAYBARN_VERSION}"
      # Offline: ci/run-integration.sh starts test/mock_api/server.py and points
      # the worker's POLYMARKET_*_URL overrides at it.
      - name: Run test/sql over ${{ matrix.transport }}
        run: |
          export WORKER="$PWD/.venv/bin/vgi-polymarket"
          export HAYBARN_UNITTEST="$PWD/.tools/bin/haybarn-unittest"
          TRANSPORT=${{ matrix.transport }} PYTHON="uv run --no-project python" ci/run-integration.sh

  live:
    name: live API tests
    runs-on: ubuntu-latest
    # Not on pull requests: a fork's PR should not be able to fail on, or spend,
    # someone else's rate limit. Also scheduled so the assertions about Polymarket's
    # own behaviour — page caps, silently ignored filters, the activity types it
    # emits — keep being checked against the real thing rather than a memory.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync --no-sources --group dev
      - name: Live tests
        run: uv run --no-sources pytest -q -m live --ignore=tests/test_end_to_end.py

  metadata:
    name: Metadata quality (vgi-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      # Published vgi-python/vgi-rpc, not the sibling checkouts in [tool.uv.sources].
      - run: uv sync --locked --no-dev --no-sources
      - name: Read fail_on from vgi-lint.toml
        id: lintcfg
        run: python3 -c 'import tomllib; print("fail_on=" + tomllib.load(open("vgi-lint.toml", "rb")).get("fail_on", "error"))' >> "$GITHUB_OUTPUT"
      - uses: Query-farm/vgi-lint-check@v2
        with:
          location: ${{ github.workspace }}/.venv/bin/vgi-polymarket
          # Set in vgi-lint.toml, so local runs and CI agree.
          fail-on: ${{ steps.lintcfg.outputs.fail_on }}
          # Examples read Polymarket's live public API, which rate-limits shared
          # runner IPs (HTTP 429). The static gate is the real gate here; the
          # live job above checks behaviour against the real API.
          execute: "false"
